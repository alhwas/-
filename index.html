<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<meta name="color-scheme" content="light dark">
<title>رحلاتي — الطيران العماني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
:root{--navy:#0a1f3d;--navy2:#122c54;--accent:#e8a317;--accent2:#f4c04a;--bg:#f4f7fb;--card:#fff;--line:#e2e8f0;--muted:#64748b;--field:#f8fafc;--err:#dc2626;--ok:#16a34a;--navybg:#0a1f3d;--hl:#fff8e6;--badbg:#fef2f2;--bgt:rgba(244,247,251,0);--wait:#ca8a04}
*{box-sizing:border-box;margin:0;padding:0}
button,input,textarea,select{font-family:inherit}
body{font-family:'Cairo','Noto Sans Arabic',system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--navy);min-height:100vh;-webkit-tap-highlight-color:transparent}
.hd{background:linear-gradient(145deg,#0a1f3d 0%,#163a6b 45%,#0d2a52 100%);color:#fff;padding:22px 16px 52px;position:relative;overflow:hidden}
.hd::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='120' height='40' viewBox='0 0 120 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 28 C30 10,60 38,90 18 C105 8,115 22,120 16' fill='none' stroke='rgba(255,255,255,0.08)' stroke-width='1.5' stroke-dasharray='4 5'/%3E%3Cpath d='M10 32 C40 14,70 36,100 20' fill='none' stroke='rgba(232,163,23,0.12)' stroke-width='1.2' stroke-dasharray='3 4'/%3E%3C/svg%3E") repeat;opacity:.7;pointer-events:none}
.hd .hw{position:relative;z-index:1}
.hw{max-width:580px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.hd .sub{font-size:13px;opacity:.85;margin-top:2px}
.chip{border:0;border-radius:20px;padding:0 16px;min-height:40px;background:rgba(255,255,255,.16);color:#fff;font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(8px);transition:background .2s}
.chip:active{background:rgba(255,255,255,.28)}
.m{max-width:580px;margin:8px auto 0;padding:0 14px calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.add-fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);z-index:20;background:var(--accent);color:#0a1f3d;border:0;border-radius:28px;padding:0 26px;height:52px;font-size:15px;font-weight:700;box-shadow:0 8px 24px rgba(232,163,23,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .15s}
.add-fab:active{transform:scale(.97);box-shadow:0 4px 16px rgba(232,163,23,.4)}
.add-fab svg{width:20px;height:20px;fill:currentColor}
.card{background:var(--card);border-radius:16px;box-shadow:0 4px 20px rgba(10,31,61,.08);overflow:hidden;transition:transform .2s,box-shadow .2s}
.card:active{transform:scale(.995)}
.empty{background:var(--card);border-radius:24px;box-shadow:0 10px 30px rgba(10,31,61,.12);position:relative;overflow:hidden;line-height:0}
.empty-illu{width:100%;display:block}
.empty-illu svg{width:100%;height:auto;display:block}
.empty-illu .plane-f{animation:planeFloat 5s ease-in-out infinite}
@keyframes planeFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-5px)}}
@media(prefers-reduced-motion:reduce){.empty-illu .plane-f{animation:none}}
.band{background:linear-gradient(135deg,#0a1f3d,#163a6b);color:#fff;padding:18px 16px 16px;display:flex;flex-direction:column;gap:10px}
.route{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pt{display:flex;flex-direction:column;gap:1px;min-width:0}
.pt b{font-size:26px;font-weight:700;letter-spacing:.5px;direction:ltr}
.pt small{font-size:11.5px;opacity:.8;font-weight:500}
.pt.r b{color:var(--accent2)}
.path-wrap{position:relative;height:56px;flex:1;margin:0 4px;min-width:0}
.path-wrap svg.arc{width:100%;height:100%;display:block;overflow:visible}
.path-wrap .trail{fill:none;stroke:rgba(255,255,255,.4);stroke-width:1.6;stroke-dasharray:3 4;stroke-linecap:round}
.path-wrap .dot{fill:rgba(255,255,255,.7)}
.path-wrap .pl{fill:var(--accent2);filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.times{display:flex;justify-content:space-between;font-size:11px;opacity:.75;margin-top:2px}
.body{padding:14px 16px 16px}
.pill{border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;display:flex;flex-direction:column;gap:2px}
.pill small{font-weight:400;font-size:12px;opacity:.9}
.k-wait{background:#fef9c3;color:#854d0e}.k-open{background:#dcfce7;color:#166534}.k-closed{background:#fee2e2;color:#991b1b}.k-past{background:#f1f5f9;color:#475569}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:14px 0 10px}
.it small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.it b{font-size:14.5px;font-weight:600}
.who{font-size:12.5px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.acts{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin-top:10px;width:100%;min-width:0;box-sizing:border-box}
.acts button,.acts a{box-sizing:border-box;flex:1 1 125px;min-width:min(125px,100%);max-width:100%;min-height:42px;height:auto;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--navy);font-size:12.5px;font-weight:600;line-height:1.4;white-space:normal;overflow-wrap:anywhere;word-break:normal;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;transition:background .15s,border-color .15s,transform .15s}
.acts button:active,.acts a:active{transform:scale(.98);background:var(--field)}
.acts svg{width:16px;height:16px;fill:currentColor;flex:0 0 16px}
.acts .pri{background:var(--accent);border-color:var(--accent);color:#0a1f3d;flex:1 1 100%;min-height:46px;height:auto;font-size:14.5px;padding:11px 12px}
.acts .ok{background:var(--ok);border-color:var(--ok);color:#fff}
.acts .del{color:var(--err);border-color:#fecaca}
.foot{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px;padding:0 4px}
.foot button{background:var(--card);border:0;border-radius:20px;box-shadow:0 4px 16px rgba(10,31,61,.07);color:var(--navy);font-size:12.5px;font-weight:600;padding:12px 11px;min-width:0;display:flex;flex-direction:row;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;transition:transform .15s,box-shadow .15s}
.foot button:active{transform:scale(.97);box-shadow:0 2px 8px rgba(10,31,61,.1)}
.foot svg{width:16px;height:16px;fill:currentColor;flex:none}
.dlg{position:fixed;inset:0;overflow-y:auto;background:rgba(10,31,61,.5);display:flex;align-items:center;justify-content:center;z-index:30;backdrop-filter:blur(4px);animation:fade .2s ease;padding:16px}
.dlg[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{margin:auto;background:var(--card);width:100%;max-width:420px;max-height:85vh;overflow:auto;border-radius:20px;padding:20px 18px 24px;animation:slide .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 12px 40px rgba(10,31,61,.2)}
@keyframes slide{from{transform:scale(.94) translateY(12px);opacity:.7}to{transform:scale(1) translateY(0);opacity:1}}
.sheet h2{font-size:18px;margin-bottom:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.sheet.ctr h2{justify-content:center;text-align:center}
.sheet.ctr p{text-align:center}
.sheet.ctr .acts{justify-content:center}
.sheet h2 svg{width:20px;height:20px;fill:var(--navy2)}
.sheet p{font-size:14px;line-height:1.8;color:#334155;margin-bottom:6px}
.sheet .orig{margin-top:10px;font-size:12px;background:var(--field);border-radius:8px;padding:10px;color:var(--muted);direction:ltr;text-align:left;overflow-wrap:anywhere}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}.f.full{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:var(--navy2);display:flex;align-items:center;gap:5px}
.f label svg{width:14px;height:14px;fill:var(--navy2)}
.f input,.f select{height:46px;border:1.5px solid var(--line);border-radius:11px;background:var(--field);padding:0 12px;font-size:15px;font-weight:500;color:var(--navy);width:100%;transition:border-color .2s,box-shadow .2s}
.f input:focus,.f select:focus{border-color:var(--navy2);box-shadow:0 0 0 4px rgba(18,44,84,.1);outline:none}
.f input.ltr{direction:ltr;text-align:right}
.f input.bad,.f select.bad{border-color:var(--err);background:var(--badbg)}
.apt-btn{width:100%;height:46px;border:1.5px solid var(--line);border-radius:11px;background:var(--field);padding:0 12px;font-size:15px;font-weight:500;color:var(--navy);display:flex;align-items:center;justify-content:space-between;cursor:pointer;text-align:right}
.apt-btn span{direction:ltr;font-weight:600}
.apt-drop{display:none;margin-top:6px}
.apt-drop.on{display:block}
.apt-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.apt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--field);border:1.5px solid transparent;cursor:pointer;transition:all .15s}
.apt:active{transform:scale(.98)}
.apt.on{background:var(--hl);border-color:var(--accent)}
.apt .code{font-weight:700;font-size:15px;letter-spacing:.5px;min-width:48px;direction:ltr;text-align:left}
.apt .name{font-size:13.5px;color:var(--navy);flex:1}
.apt-search{width:100%;height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;font-size:14.5px;margin-bottom:4px}
#ov{position:fixed;inset:0;background:var(--navybg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;z-index:40;padding:24px;text-align:center}
#ov.on{display:flex}
.sp{width:48px;height:48px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#ovMsg{font-size:16px;font-weight:600}#ovSub{font-size:13px;opacity:.75}
.ob{display:none;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.ob button{height:44px;padding:0 20px;border-radius:12px;border:0;font-size:14.5px;font-weight:700;cursor:pointer}
#fb{background:var(--accent);color:#0a1f3d}#cb{background:rgba(255,255,255,.15);color:#fff}
#viewer{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;z-index:35}
#viewer.on{display:flex}
.bar{height:52px;background:var(--navybg);color:#fff;display:flex;align-items:center;gap:12px;padding:0 12px;flex:none}
.bar button{height:40px;padding:0 12px;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer}
.bar span{font-weight:700;font-size:15px}
#fr{flex:1;width:100%;border:0;background:#fff}
#toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navybg);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;z-index:300;display:none;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastIn .2s ease}
#toast .tundo{margin-inline-start:14px;background:var(--accent);color:#0a1f3d;border:0;border-radius:8px;padding:5px 14px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.mon{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:2px 0 8px}
.mon i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.donebadge{display:inline-block;margin-inline-start:8px;background:#dcfce7;color:#166534;border-radius:8px;padding:1px 8px;font-size:11.5px;font-weight:600}
.passimg{width:100%;border-radius:12px;border:1px solid var(--line);margin-bottom:8px}
#banner{max-width:580px;margin:12px auto 0;padding:0 14px;display:flex;flex-direction:column;gap:8px}
#banner:empty{margin:0;padding:0}
#banner:not(:empty)+.m{margin-top:16px}
.bnr.info{background:#e0f2fe;border-color:#7dd3fc;color:#075985}.bnr.info svg{fill:#0284c7}.bnr.info button{background:#0284c7;color:#fff}
.bnr.ok{background:#dcfce7;border-color:#86efac;color:#166534}.bnr.ok svg{fill:#16a34a}.bnr.ok button{background:#16a34a;color:#fff}
.bnr.gray{background:#f1f5f9;border-color:#cbd5e1;color:#475569}.bnr.gray svg{fill:#64748b}.bnr.gray button{background:var(--navybg);color:#fff}
.bnr span{flex:1;min-width:0;line-height:1.5}
#mini{position:fixed;top:0;left:0;right:0;z-index:24;background:linear-gradient(145deg,#0a1f3d,#163a6b);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));transform:translateY(-115%);transition:transform .22s ease;box-shadow:0 4px 16px rgba(10,31,61,.28)}
#mini.on{transform:none}
#mini b{font-size:17px;font-weight:700}#mini span{font-size:12.5px;opacity:.85;flex:1;min-width:0;direction:ltr;text-align:right}
body::after{content:'';position:fixed;left:0;right:0;bottom:0;height:calc(110px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 38%,var(--bgt));pointer-events:none;z-index:19}
.bnr{background:#fef9c3;border:1px solid #fde047;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:13.5px;color:#713f12;font-weight:600}
.bnr svg{width:22px;height:22px;fill:#ca8a04;flex:none}
.bnr button{margin-inline-start:auto;background:var(--accent);color:#0a1f3d;border:0;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;flex:none}
.bnr.urgent{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.bnr.urgent svg{fill:#dc2626}
.bnr.urgent button{background:#dc2626;color:#fff}
#ticketViewer{position:fixed;inset:0;background:#eef2f7;display:none;flex-direction:column;z-index:60}
#ticketViewer.on{display:flex}.ticket-toolbar{display:flex;align-items:center;gap:8px;padding:10px;background:var(--navybg);color:#fff;flex:none}
.ticket-toolbar strong{flex:1;font-size:15px}.ticket-toolbar button,.ticket-actions button{border:0;border-radius:10px;min-height:42px;padding:0 13px;font:600 13px 'Cairo',sans-serif;cursor:pointer}
.ticket-toolbar button{background:rgba(255,255,255,.15);color:#fff}#ticketFrame{border:0;width:100%;flex:1;min-height:0;background:#fff}
.ticket-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;background:var(--card);box-shadow:0 -4px 18px #0a1f3d12;flex:none}
.ticket-actions button{background:var(--field);color:var(--navy);border:1px solid var(--line)}.ticket-actions .pdf{background:var(--accent);border-color:var(--accent)}
@media(max-width:360px){.ticket-actions{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.sp{animation-duration:2.5s}.sheet,.dlg,#toast{animation:none}.bnr{transition:none}}

/* ===== شاشة تسجيل الدخول ===== */
#auth{position:fixed;inset:0;background:linear-gradient(135deg,#0a1f3d,#163a6b);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;overflow:auto}
#auth.off{display:none}
.auth-box{max-width:420px;width:100%;background:#fff;border-radius:20px;padding:32px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .35s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.auth-logo{text-align:center;margin-bottom:8px}
.auth-logo svg{width:56px;height:56px;fill:var(--navy)}
.auth-title{text-align:center;font-size:24px;font-weight:700;color:var(--navy);margin:8px 0 4px}
.auth-sub{text-align:center;font-size:13.5px;color:var(--muted);margin-bottom:26px;line-height:1.6}
.auth-input{width:100%;height:52px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);padding:0 16px;font-size:16px;font-weight:500;color:var(--navy);margin-bottom:12px;text-align:center;letter-spacing:1px;transition:border-color .2s,box-shadow .2s}
.auth-input:focus{border-color:var(--navy2);box-shadow:0 0 0 4px rgba(18,44,84,.1);outline:none}
.auth-input.bad{border-color:var(--err);background:#fef2f2}
.auth-input.code{font-size:30px;font-weight:800;letter-spacing:14px;font-family:monospace;direction:ltr;text-align:center;padding-right:0}
.auth-btn{width:100%;height:52px;border:0;border-radius:12px;background:var(--accent);color:#0a1f3d;font-size:16px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 6px 16px rgba(232,163,23,.35)}
.auth-btn:active{transform:scale(.98);box-shadow:0 3px 10px rgba(232,163,23,.4)}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-btn.alt{background:#f1f5f9;color:var(--navy);box-shadow:none;margin-top:8px}
.auth-note{margin-top:16px;padding:12px;background:#f4f7fb;border-radius:10px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.7}
.auth-err{margin-top:12px;padding:10px 12px;background:#fef2f2;color:#b91c1c;border-radius:10px;font-size:13px;text-align:center;line-height:1.6;word-break:break-word;direction:rtl}
.auth-info{margin-top:16px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
.auth-check{margin:8px 0 12px;display:flex;align-items:flex-start;gap:10px;padding:12px;background:#f8fafc;border-radius:10px;cursor:pointer;font-size:13.5px;color:var(--navy2);line-height:1.5}
.auth-check input{margin-top:3px;width:18px;height:18px;flex:none;cursor:pointer;accent-color:var(--accent)}
.timer{margin-top:8px;font-size:12.5px;color:var(--muted);text-align:center}
.timer b{color:var(--accent)}
@media(prefers-reduced-motion:reduce){.auth-box{animation:none}}

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sheet:focus{outline:none}

/* ===== (9) الوضع الداكن — يتبع إعدادات الهاتف ===== */
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1220;--card:#131d31;--line:#25334f;--muted:#97a6bd;--field:#0e1729;--navy:#e6edf7;--navy2:#c5d4ec;--navybg:#1e2f4f;--hl:rgba(232,163,23,.16);--badbg:#3a1c1f;--bgt:rgba(11,18,32,0)}
  .sheet p{color:#cbd5e1}
  .card,.empty,.sheet,.foot button{box-shadow:0 4px 20px rgba(0,0,0,.35)}
  .auth-box{--navy:#0a1f3d;--navy2:#122c54;--card:#fff;--line:#e2e8f0;--muted:#64748b;--field:#f8fafc}
}
</style>
</head>
<body>

<!-- ===== شاشة تسجيل الدخول ===== -->
<div id="auth" class="off">
  <div class="auth-box" id="authBox"></div>
</div>

<header class="hd"><div class="hw">
  <div><h1>رحلاتي</h1><div class="sub">مطار الانطلاق: <b id="baseTxt"></b></div></div>
  <button class="chip" id="setBase">تغيير المطار</button>
</div></header>
<div id="mini"><b>رحلاتي</b><span id="miniBase"></span><button class="chip" id="miniChg" type="button">تغيير المطار</button></div>

<div id="banner" aria-live="polite"></div>

<main class="m">
  <section id="list"></section>
  <div class="foot">
    <button id="bExp"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>نسخة احتياطية</button>
    <button id="bImp"><svg viewBox="0 0 24 24"><path d="M19 15v4H5v-4H3v6h18v-6h-2zm-6-2V5h-2v8H7l5 5 5-5h-4z"/></svg>استعادة</button>
    <button id="bProfile"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>بياناتي</button>
  </div>
</main>

// حذف مع إمكانية التراجع (6 ثوانٍ) — الحذف الفعلي (البطاقة المحفوظة + المزامنة) يتم بعد انتهاء المهلة
let pendDel=null;
function commitDel(){if(!pendDel)return;const p=pendDel;pendDel=null;clearTimeout(p.tm);del[p.t.id]=Date.now();DB.del(p.t.id).catch(()=>{});save()}

const depOf=t=>new Date(t.date+'T'+t.time+':00');

function dur(ms){const m=Math.max(0,Math.floor(ms/6e4)),d=Math.floor(m/1440),hh=Math.floor(m%1440/60),mm=m%60,p=[];if(d)p.push(d+' يوم');if(hh)p.push(hh+' ساعة');if(mm||!p.length)p.push(mm+' دقيقة');return p.join(' و ')}
const fdate=d=>d.toLocaleDateString('ar-OM-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

function state(t){const n=Date.now(),o=openOf(t),c=closeOf(t),d=depOf(t);if(n<o)return{k:'wait',txt:'يفتح التسجيل بعد '+dur(o-n),sub:'الفتح: '+fdate(o)+' الساعة '+ftime(o)};if(n<c)return{k:'open',txt:'التسجيل مفتوح الآن',sub:'يغلق بعد '+dur(c-n)+' (الساعة '+ftime(c)+')'};if(n<d)return{k:'closed',txt:'أُغلق التسجيل',sub:'أُغلق قبل الإقلاع بـ '+t.closeH+' ساعة'};return{k:'past',txt:'انتهت الرحلة',sub:fdate(d)}}

// ===== API Helper =====
const wurl=p=>PROXY.replace(/\/?$/,'/')+p;
async function fetchJ(path,opts={},ms=20000){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms);
  try{
    const r=await fetch(wurl(path),{...opts,signal:ctl.signal});
    const t=await r.text();let j={};try{j=JSON.parse(t)}catch(e){}
    if(!r.ok)throw new Error(j.error||('خطأ من الخادم ('+r.status+')'));
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('انتهت المهلة — تحقق من الاتصال وحاول مجددًا');
    if(e instanceof TypeError)throw new Error('تعذّر الاتصال بالخادم ('+(e.message||'network')+')');
    throw e;
  }finally{clearTimeout(tm)}
}
async function api(path,opts={}){
  const headers=opts.headers||{};
  headers['Content-Type']='application/json';
  if(auth.token)headers['Authorization']='Bearer '+auth.token;
  const r=await fetch(wurl(path),{...opts,headers});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){logoutLocal();throw new Error('انتهت الجلسة');}
  if(!r.ok)throw new Error(j.error||'خطأ في الاتصال');
  return j;
}

// ===== شاشة الدخول =====
let authStep='email'; // email | code
let authData={email:'',code:'',timerId:0,seconds:600};

function authErr(box,m){let e=box.querySelector('.auth-err');if(!e){e=h('div','auth-err');box.appendChild(e)}e.textContent=m;toast(m,5000)}
function renderAuth(){
  const box=$('authBox');box.innerHTML='';
  const logo=h('div','auth-logo');logo.innerHTML=ICONS.plane;box.appendChild(logo);
  box.appendChild(h('div','auth-title','رحلاتي'));
  box.appendChild(h('div','auth-sub','رحلاتك في مكان واحد آمن'));

  if(authStep==='email'){
    const i=h('input','auth-input');i.type='email';i.placeholder='you@example.com';i.autocomplete='email';i.inputMode='email';i.dir='ltr';
    i.value=authData.email||'';
    box.appendChild(i);

    const btn=h('button','auth-btn','دخول / تسجيل');
    btn.onclick=async()=>{
      const em=i.value.trim().toLowerCase();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){i.classList.add('bad');toast('أدخل إيميلًا صحيحًا');return}
      i.classList.remove('bad');
      btn.disabled=true;btn.textContent='جارٍ الإرسال...';
      const ctl=new AbortController();
      const tm=setTimeout(()=>ctl.abort(),15000);
      try{
        await fetchJ('auth/send',{
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=UTF-8'},
          body:JSON.stringify({email:em}),
          signal:ctl.signal
        });
        clearTimeout(tm);
        authData.email=em;
        authStep='code';
        authData.seconds=600;
        renderAuth();
        startTimer();
        setTimeout(async()=>{
          if(authStep!=='code'||authData.email!==em)return;
          try{const s=await fetchJ('auth/mail-status?email='+encodeURIComponent(em),{},10000);if(s&&s.error)authErr($('authBox'),s.error)}catch(_){}
        },7000);
      }catch(e){
        clearTimeout(tm);
        btn.disabled=false;btn.textContent='دخول / تسجيل';
        authErr(box, e.name==='AbortError' ? 'انتهت المهلة — حاول مرة ثانية' : (e.message||'تعذّر الإرسال'));
      }
    };
    box.appendChild(btn);

    box.appendChild(h('div','auth-info','سنرسل لك رمز تحقق مكوّن من 6 أرقام. لا حاجة لكلمة مرور.'));
  }else{
    box.appendChild(h('div','auth-sub','أُرسل رمز التحقق إلى:'));
    const emShow=h('div');emShow.style.cssText='text-align:center;font-weight:700;color:var(--navy);direction:ltr;margin-bottom:16px;word-break:break-all';
    emShow.textContent=authData.email;
    box.appendChild(emShow);

    const i=h('input','auth-input code');
    i.type='tel';i.maxLength=6;i.inputMode='numeric';i.placeholder='000000';i.autocomplete='one-time-code';
    i.value=authData.code||'';
    i.oninput=()=>{i.value=i.value.replace(/\D/g,'').slice(0,6);};
    box.appendChild(i);

    const btn=h('button','auth-btn','تحقق');
    btn.onclick=async()=>{
      const c=i.value.trim();
      if(!/^\d{6}$/.test(c)){i.classList.add('bad');toast('أدخل 6 أرقام');return}
      i.classList.remove('bad');
      btn.disabled=true;btn.textContent='جارٍ التحقق...';
      try{
        const j=await fetchJ('auth/verify',{
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=UTF-8'},
          body:JSON.stringify({email:authData.email,code:c})
        });
        auth.token=j.token;auth.email=j.email;
        LS.set('auth.token',j.token);LS.set('auth.email',j.email);
        if(j.trips&&j.trips.length){trips=j.trips;LS.set('trips',trips);}
        profile.email=j.email;
        LS.set('profile',profile);
        synced=true;
        stopTimer();
        $('auth').classList.add('off');
        render();
        toast('✅ مرحبًا بك');
        // ربط push الموجود إن وجد
        autoResubscribePush();
      }catch(e){
        btn.disabled=false;btn.textContent='تحقق';
        authErr(box,e.message||'رمز خاطئ');
      }
    };
    box.appendChild(btn);

    const alt=h('button','auth-btn alt','تغيير الإيميل');
    alt.onclick=()=>{stopTimer();authStep='email';authData.code='';renderAuth()};
    box.appendChild(alt);

    const timer=h('div','timer');
    timer.id='authTimer';
    box.appendChild(timer);
    updateTimer();
  }
}
function startTimer(){
  stopTimer();
  authData.seconds=600;
  authData.timerId=setInterval(()=>{
    authData.seconds--;
    if(authData.seconds<=0){stopTimer();toast('انتهت صلاحية الرمز');authStep='email';renderAuth();return}
    updateTimer();
  },1000);
}
function stopTimer(){if(authData.timerId){clearInterval(authData.timerId);authData.timerId=0}}
function updateTimer(){
  const t=$('authTimer');if(!t)return;
  const m=Math.floor(authData.seconds/60),s=authData.seconds%60;
  t.innerHTML='صالح لمدة <b>'+m+':'+pad(s)+'</b>';
}

function logoutLocal(){
  auth={token:'',email:''};
  LS.del('auth.token');LS.del('auth.email');
  $('auth').classList.remove('off');
  authStep='email';authData.email='';authData.code='';
  stopTimer();renderAuth();
}
function doLogout(){
  sheet('تسجيل الخروج',[para('سيتم حذف جلستك من هذا الجهاز. رحلاتك محفوظة في السحابة.')],[
    {label:'إلغاء'},

    }}

}
function checkAuth(){
  if(!auth.token||!auth.email){renderAuth();return false}
  return true;
}

// ===== المزامنة =====
let pushT,syncFail=false;
function cloudPush(){if(!auth.token)return;clearTimeout(pushT);pushT=setTimeout(pushNow,1200)}
async function pushNow(){
  if(!auth.token)return;
  try{
    await api('sync',{method:'POST',body:JSON.stringify({
      data:{trips,del,base,profile,emailNotify:profile.emailNotify!==false,cloud:{tz:'+04:00'},ts:Date.now()}
    })});syncFail=false;
  }catch(e){syncFail=true}
}
async function cloudPull(manual){
  if(!auth.token)return;
  try{
    const j=await api('me');
    if(j.trips&&j.trips.length){
      // merge: نأخذ الأحدث من كل جهاز
      const map={};trips.forEach(t=>map[t.id]=t);
      j.trips.forEach(r=>{const l=map[r.id];if(!l||(r.upd||0)>(l.upd||0))map[r.id]=r});
      trips=Object.values(map);LS.set('trips',trips);
    }
    if(j.profile&&j.profile.email)profile.email=j.profile.email;
    synced=true;
    try{const s=await api('status');mon=s.status||{}}catch(e){mon={}}
    render();
    if(manual)toast('تمت المزامنة');
  }catch(e){if(manual)toast('تعذّرت المزامنة')}
}
function monLine(t){
  if(t.done||!auth.token||state(t).k==='past')return null;
  const s=mon[t.id],d=h('div','mon'),i=h('i');d.append(i);
  let txt='المراقبة مفعّلة';
  if(profile.email)txt+=' — يصلك تنبيه على الهاتف والإيميل';
  if(s&&s.sent&&s.sent.avail){txt='أُرسل إشعار بتوفر التسجيل — افتح الرابط وأكمل';i.style.background='var(--ok)'}
  else if(s&&s.last){txt='آخر فحص قبل '+Math.max(0,Math.round((Date.now()-s.last)/6e4))+' دقيقة'+(s.res==='no'?' — لا يوجد حجز بعد':'')}
  d.append(h('span',null,txt));return d;
}

// ===== بطاقة الصعود =====
const DB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('trips-db',1);r.onupgradeneeded=()=>r.result.createObjectStore('passes');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const q=fn(db.transaction('passes',mode).objectStore('passes'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  get(id){return this.tx('readonly',s=>s.get(id))},put(id,v){return this.tx('readwrite',s=>s.put(v,id))},del(id){return this.tx('readwrite',s=>s.delete(id))}
};
// ===== رسالة تأكيد التسجيل (المقعد / الصعود / البوابة) =====
const MON3=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function parseCheckin(txt){
  const c=(txt||'').replace(/\s+/g,' ').trim();
  const g=re=>{const m=c.match(re);return m?m[1].trim():''};
  const fm=c.match(/Flight:?\s*([A-Z0-9]{2})\s*(\d{1,4})\s*\/\s*(\d{1,2})\s*([A-Z]{3})/i);
  const seat=g(/Seat:?\s*(\d{1,3}\s?[A-Z])\b/i).replace(/\s/g,'').toUpperCase();
  if(!fm||!seat)return null;
  const mon=MON3.indexOf(fm[4].toUpperCase())+1;if(!mon)return null;
  const gate=g(/Gate:?\s*(.+?)\s*(?:Verify|This message|$)/i);
  return{carrier:fm[1].toUpperCase(),flight:String(+fm[2]),day:+fm[3],mon,seat,seq:g(/Sec\.?:?\s*(\d+)/i),boarding:g(/Boarding:?\s*(\d{1,2}:\d{2})/i),gate:/unknown|not yet|tbd|^-+$/i.test(gate)?'':gate.toUpperCase()};
}
function applyCheckin(c){
  const mm=pad(c.mon),dd=pad(c.day);
  const t=trips.find(x=>x.carrier===c.carrier&&String(+x.flight)===c.flight&&(x.date||'').slice(5)===mm+'-'+dd);
  if(!t){toast('لا توجد رحلة مطابقة لـ '+c.carrier+' '+c.flight+' بتاريخ '+c.day+'/'+c.mon,4500);return false}
  t.seat=c.seat;if(c.boarding)t.boarding=c.boarding;t.gate=c.gate;if(c.seq)t.seq=c.seq;
  t.done=true;t.upd=Date.now();save();render();toast('تم حفظ المقعد '+c.seat+' وإيقاف مراقبة الرحلة',3500);buzz([40,60,40]);return true;
}

// ===== Push =====
const b64u=b=>Uint8Array.from([...atob((b+'='.repeat((4-b.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'))].map(c=>c.charCodeAt(0)));

const LOCAL_APP=/^(127\.0\.0\.1|localhost)$/.test(location.hostname); // تطبيق WebView محلي: Push غير مدعوم
async function hasPushSubscription(){
  try{const r=await navigator.serviceWorker.getRegistration();const s=await r?.pushManager?.getSubscription();return !!s}catch(e){return false}
}

async function enablePush(quiet){
  const say=m=>{if(!quiet)toast(m)};
  if(!('serviceWorker'in navigator)||!('PushManager'in window)){say('الجهاز لا يدعم الإشعارات');return false}
  if(!window.isSecureContext){say('افتح التطبيق من https');return false}
  if(!auth.token){say('سجّل دخول أولًا');return false}
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){say('لم توافق على الإشعارات');return false}
  try{
    const r=await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const{key}=await fetch(wurl('vapid-public')).then(r=>r.json());
    if(!key){window.pushErr='no vapid key';say('الخادم لا يدعم الإشعارات');return false}
    const s=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
    await api('subscribe',{method:'POST',body:JSON.stringify({subscription:s})});
    say('✅ تم تفعيل الإشعارات');
    renderBanner();
    return true;
  }catch(e){window.pushErr=String(e&&e.message||e).slice(0,80);say('تعذّر التفعيل: '+(e.message||e));return false}
}
async function disablePush(){
  try{
    const r=await navigator.serviceWorker.getRegistration(),s=await r?.pushManager?.getSubscription();
    if(!s)return;
    await api('unsubscribe',{method:'POST',body:JSON.stringify({endpoint:s.endpoint})});
    await s.unsubscribe();toast('تم إيقاف الإشعارات');
  }catch(e){}
}
async function autoResubscribePush(){
  // بعد تسجيل الدخول — إن كان لديه اشتراك، أعِد ربطه بالحساب
  try{
    const r=await navigator.serviceWorker.getRegistration();
    const s=await r?.pushManager?.getSubscription();
    if(s){
      await api('subscribe',{method:'POST',body:JSON.stringify({subscription:s})});
      renderBanner();
    }
  }catch(e){}
}

// ===== Airport picker =====
function airportPicker(current,multi){
  let sel=multi?((current||'').match(/[A-Z]{3}/g)||[]):(current||'');
  const has=c=>multi?sel.includes(c):sel===c;
  const wrap=h('div'),btn=h('div','apt-btn');
  const updateBtn=()=>{const codes=multi?sel:(sel?[sel]:[]);btn.innerHTML=`<span>${codes.join(' - ')||'اختر'}</span><span style="opacity:.6;font-size:12px">${codes.map(c=>NAMES[c]||'').filter(Boolean).join(' · ')}</span>`};
  updateBtn();
  const drop=h('div','apt-drop');
  const search=document.createElement('input');search.className='apt-search';search.placeholder='ابحث عن مطار أو رمز...';search.type='search';
  const list=h('div','apt-list'),items=[];
  const paint=()=>items.forEach(x=>x.classList.toggle('on',has(x.dataset.code)));
  Object.entries(AIRPORTS).sort((a,b)=>a[1].localeCompare(b[1],'ar')).forEach(([code,ar])=>{
    const item=h('div','apt'+(has(code)?' on':''));
    item.innerHTML=`<span class="code">${code}</span><span class="name">${ar}</span>`;item.dataset.code=code;
    item.onclick=()=>{if(multi){sel=has(code)?sel.filter(x=>x!==code):sel.concat(code);paint();updateBtn()}else{sel=code;paint();updateBtn();drop.classList.remove('on')}};
    items.push(item);list.appendChild(item);
  });
  search.oninput=()=>{const q=search.value.trim().toLowerCase();items.forEach(it=>{const code=it.dataset.code.toLowerCase(),name=it.querySelector('.name').textContent.toLowerCase();it.style.display=(!q||code.includes(q)||name.includes(q))?'flex':'none'})};
  if(multi){const hn=h('div',null,'يمكن اختيار أكثر من مطار بترتيب الرحلة');hn.style.cssText='font-size:12px;color:var(--muted);padding:2px 4px 6px';drop.appendChild(hn)}
  drop.append(search,list);
  btn.onclick=()=>drop.classList.toggle('on');
  wrap.append(btn,drop);
  return{el:wrap,get:()=>multi?sel.join(' - '):sel,setBad:bad=>{btn.style.borderColor=bad?'var(--err)':'var(--line)'}};
}

// ===== URL + Precheck =====
function buildUrl(t){const d=t.date.split('-');const q=new URLSearchParams({'request.Surname':t.surname,'request.BookingCode':t.booking,'request.CarrierCode':t.carrier,'request.FlightNumber':t.flight,'request.BoardingPoint':t.from,'request.DepartureDate':d[2]+'/'+d[1]+'/'+d[0]});return 'https://iport.travelport.com/ici/ov/en/Home/FindPassenger?'+q.toString().replace(/%2F/g,'/')}
async function precheck(url){
  const target=PROXY?PROXY+(PROXY.includes('?')?'&':'?')+'u='+encodeURIComponent(url):url;
  const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),15000);
  try{
    const r=await fetch(target,{credentials:'omit',signal:ctrl.signal});
    const doc=new DOMParser().parseFromString(await r.text(),'text/html');
    const bad=/incorrect|invalid|error|not found|not available|unable|failed|no booking/i;
    for(const n of doc.querySelectorAll('.alert-danger,.alert-error,.validation-summary-errors,.field-validation-error,[role="alert"],.alert,.error')){const x=n.textContent.replace(/\s+/g,' ').trim();if(x&&bad.test(x))return{readable:true,error:x}}
    return{readable:true,error:r.ok?'':'HTTP '+r.status};
  }catch(e){return{readable:false}}finally{clearTimeout(tm)}
}

// ===== Parse Message =====
function parseMsg(txt){
  const clean=txt.replace(/\s+/g,' ').trim();
  const g=re=>{const m=clean.match(re);return m?m[1].trim():''};
  const dateMatch=clean.match(/\b(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})\b/);
  if(!dateMatch)return null;
  const[,dd,mm,yy]=dateMatch;
  const flight=g(/Flight\s*(?:Number|No\.?|#)?\s*:?\s*(\d+)/i);
  const booking=g(/Booking\s*(?:No\.?|Number|Code|Ref)?\s*:?\s*(\d+)/i)||g(/BookingCode=(\d+)/i);
  if(!flight||!booking)return null;
  const timeMatch=clean.match(/Dep(?:arture)?\s*Time\s*:?\s*(\d{1,2}:\d{2})/i);
  const tm=timeMatch?timeMatch[1].split(':'):[];
  const name=g(/Dear\s+(.+?)\s*[,.]/i).replace(/\s+/g,' ');
  const route=clean.match(/From\s+(.+?)\s+To\s+(.+?)(?:\.|\s*-|\s*Dep)/i);
  const fromCode=route?(route[1].match(/[A-Z]{3}/)||[])[0]:'';
  const phones=(clean.match(/\(([\d\s\/,+\-]+)\)/)||[])[1]||'';

  const emailOn=profile.emailNotify!==false&&!!profile.email;
  if(hasPush&&profile.pushFail){profile.pushFail=false;LS.set('profile',profile)}
  if(!hasPush&&live.length&&auth.token&&(!emailOn||(pushOk&&!profile.pushFail)))L.push(mk('',ICONS.bell,'فعّل الإشعارات لتصلك تنبيهات فتح التسجيل','تفعيل',askNotificationsIfNeeded));
  // 3) التسجيل يفتح قريبًا (خلال ساعتين)
  const soon=live.filter(t=>state(t).k==='wait'&&+openOf(t)-now<2*36e5).sort((a,b)=>openOf(a)-openOf(b))[0];
  if(soon)L.push(mk('info',ICONS.clock,'يفتح التسجيل لرحلة '+nm(soon)+' بعد '+dur(+openOf(soon)-now),'',null));
  // 4) الإقلاع قريب (خلال 3 ساعات)
  const dep=trips.filter(t=>t.date&&t.time&&+depOf(t)>now&&+depOf(t)-now<3*36e5).sort((a,b)=>depOf(a)-depOf(b))[0];
  if(dep)L.push(mk('ok',ICONS.plane,'رحلة '+nm(dep)+' تقلع بعد '+dur(+depOf(dep)-now)+' — توجّه للمطار','',null));
  // 5) سُجّل الوصول لكن بطاقة الصعود غير محفوظة
  const np=trips.find(t=>t.date&&t.time&&t.done&&!t.pass&&+depOf(t)>now);
  if(np)L.push(mk('info',ICONS.ticket,'احفظ بطاقة الصعود لرحلة '+nm(np)+' لتظهر بدون إنترنت','حفظ',()=>passSheet(np)));
  // 6) تذكير بالنسخة الاحتياطية (كل 14 يومًا)
  const lb=LS.get('lastBackup',0),sn=LS.get('bkSnooze',0);
  if(trips.length&&now-lb>14*864e5&&now>sn){
    const bb=mk('gray',ICONS.copy,lb?'مرّ أكثر من أسبوعين على آخر نسخة احتياطية':'لم تأخذ نسخة احتياطية من رحلاتك بعد','نسخ الآن',()=>$('bExp').click());
    const lt=h('button',null,'لاحقًا');lt.type='button';lt.style.cssText='background:transparent!important;color:inherit!important;border:1px solid currentColor!important;margin-inline-start:6px';lt.onclick=()=>{LS.set('bkSnooze',Date.now()+7*864e5);renderBanner()};
    bb.append(lt);L.push(bb);
  }
  // 7) الاتصال والمزامنة
  if(!navigator.onLine)L.push(mk('gray',ICONS.bell,'أنت غير متصل — رحلاتك المحفوظة متاحة، والتسجيل يحتاج إنترنت','',null));
  else if(syncFail&&auth.token)L.push(mk('gray',ICONS.bell,'تعذّرت المزامنة مع السحابة','إعادة',()=>pushNow().then(()=>renderBanner())));
  $('banner').replaceChildren(...L.slice(0,3));
}

// ===== تنبيهات محلية (تعمل والتطبيق مفتوح؛ الإشعارات الخلفية يرسلها الخادم) =====
function pushLocal(title,body,tag){
  toast(title+' — '+body);
  try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}
  try{
    if(!('Notification'in window)||Notification.permission!=='granted')return;
    const opt={body,tag,dir:'rtl',lang:'ar'};
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)navigator.serviceWorker.getRegistration().then(r=>{if(r&&r.showNotification)r.showNotification(title,opt);else new Notification(title,opt)}).catch(()=>{});
    else new Notification(title,opt);
  }catch(e){}
}
function localAlerts(){
  const now=Date.now(),fired=LS.get('fired',{});let ch=false;
  trips.forEach(t=>{
    if(!t.date||!t.time)return;
    const dep=+depOf(t),o=+openOf(t),c=+closeOf(t),nm=t.carrier+' '+t.flight,list=[];
    if(!t.done)list.push(['o60',o-36e5,'يفتح التسجيل خلال ساعة','رحلة '+nm+' — جهّز بيانات الحجز'],['o10',o-6e5,'يفتح التسجيل خلال 10 دقائق','رحلة '+nm],['c60',c-36e5,'يغلق التسجيل خلال ساعة','رحلة '+nm+' — سجّل الآن قبل الإغلاق']);
    list.push(['d180',dep-108e5,'رحلتك بعد 3 ساعات','رحلة '+nm+' — تأكد من جاهزيتك للتوجه للمطار']);
    list.forEach(([k,at,ti,bo])=>{const key=t.id+':'+k+':'+dep;if(fired[key])return;if(now>=at&&now<at+6e5&&now<dep){fired[key]=now;ch=true;pushLocal(ti,bo,key)}});
  });
  Object.keys(fired).forEach(k=>{if(now-fired[k]>7*864e5){delete fired[k];ch=true}});
  if(ch)LS.set('fired',fired);
}

// ===== Notifications Prompt =====
async function askNotificationsIfNeeded(){
  if(!auth.token){toast('سجّل دخول أولًا');return}
  const hasPush=await hasPushSubscription();
  if(hasPush&&profile.emailNotify!==false)return; // مفعّل
  const emailI=h('input');emailI.type='email';emailI.value=profile.email||auth.email||'';emailI.placeholder='you@example.com';emailI.className='ltr';emailI.inputMode='email';
  const f=h('div','f full');f.append(h('label',null,'📧 الإيميل'),emailI);

  const cb=h('input');cb.type='checkbox';cb.checked=profile.emailNotify!==false;
  const lbl=h('label','auth-check');
  lbl.style.cssText='margin:12px 0;display:flex;align-items:center;gap:10px;padding:12px;background:var(--field);border-radius:10px;cursor:pointer;font-size:13.5px;color:var(--navy2)';
  lbl.append(cb,document.createTextNode('أرسل لي تنبيهات فتح التسجيل + نسخة من التذكرة'));

  sheet('🔔 لا تفوّت تسجيل الوصول',[
    para('سنرسل لك تنبيهات على إشعارات هاتفك. اختياريًا، وإلى إيميلك أيضًا.'),
    f,
    lbl,
    para('إن لم ترغب، يمكنك التخطي — لكنك قد تفوّت وقت فتح التسجيل.')
  ],[
    {label:'لاحقًا'},
    {label:'حفظ وتفعيل',cls:'pri',keep:true,fn:async()=>{
      const em=emailI.value.trim().toLowerCase();
      if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){emailI.classList.add('bad');toast('إيميل غير صحيح');return}
      profile.email=em||profile.email;
      profile.emailNotify=cb.checked;
      LS.set('profile',profile);
      await pushNow();
      const emailOn=cb.checked&&!!profile.email;
      const supported=!LOCAL_APP&&'serviceWorker'in navigator&&'PushManager'in window&&window.isSecureContext&&typeof Notification!=='undefined';
      let pushed=await hasPushSubscription(),why='';
      if(!pushed){
        if(!supported)why='unsupported';
        else if(Notification.permission==='denied')why='blocked';
        else{pushed=await enablePush(true);if(!pushed)why=Notification.permission==='denied'?'blocked':Notification.permission==='granted'?'failed':'declined'}
      }
      profile.pushFail=!pushed&&(why==='failed'||why==='unsupported');LS.set('profile',profile);
      closeSheet();renderBanner();
      const reason={unsupported:'إشعارات الهاتف غير متاحة داخل هذا التطبيق، والتنبيهات تصلك على الإيميل',blocked:'إشعارات الهاتف محظورة — فعّلها من إعدادات المتصفح أو التطبيق',declined:'لم تتم الموافقة على إشعارات الهاتف',failed:'تعذّر ربط إشعارات الهاتف حاليًا'+(window.pushErr?' ('+window.pushErr+')':'')}[why];
      if(pushed&&emailOn)toast('✅ تم تفعيل إشعارات الهاتف والإيميل',4000);
      else if(pushed)toast('✅ تم تفعيل إشعارات الهاتف',4000);
      else if(emailOn)toast('✅ تم تفعيل تنبيهات الإيميل — '+reason,6000);
      else toast('لم يتم تفعيل أي تنبيه — '+reason,6000);
    }}
  ]);
}

  $('miniBase').textContent=base;

  if(!trips.length){
    const empty=h('div','empty');
    const illu=h('div','empty-illu');

          <stop offset="0" stop-color="#0e2d5c"/>
          <stop offset=".40" stop-color="#17396b"/>

      <path d="M4 135 C90 235 180 298 275 298 C345 298 400 285 434 262" fill="none" stroke="#0e2d5c" stroke-width="1.6" stroke-dasharray="6 6" stroke-linecap="round"/>

        <path d="M0 -29 C3.2 -29 4.2 -20 4.2 -12 L4.2 18 C4.2 24 2 28.5 0 31 C-2 28.5 -4.2 24 -4.2 18 L-4.2 -12 C-4.2 -20 -3.2 -29 0 -29 Z"/>
        <path d="M0 -24 C1.6 -24 2.3 -21 2.3 -18 L-2.3 -18 C-2.3 -21 -1.6 -24 0 -24 Z" fill="#0e2d5c" stroke="none"/>

    renderBanner();
    return;

  const s=[...trips].sort((x,y)=>{const px=depOf(x)<now,py=depOf(y)<now;return px!==py?(px?1:-1):(px?depOf(y)-depOf(x):depOf(x)-depOf(y))});
  s.forEach(t=>{const w=h('div');w.style.marginBottom='12px';w.appendChild(card(t));L.appendChild(w.firstChild);L.lastChild.style.marginBottom='12px'});
  renderBanner();
}

// ===== Ticker =====
const last={};
function tick(){
  trips.forEach(t=>{const k=state(t).k;if(last[t.id]==='wait'&&k==='open'){toast('فُتح التسجيل لرحلة '+t.carrier+' '+t.flight);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}last[t.id]=k});
  localAlerts();
  if($('dlg').hidden&&!$('viewer').classList.contains('on'))render();
}

// ===== Events =====
$('addFab').onclick=openAdd;
$('miniChg').onclick=()=>$('setBase').click();
window.addEventListener('scroll',()=>$('mini').classList.toggle('on',scrollY>150),{passive:true});
$('setBase').onclick=()=>{const pk=airportPicker(base);sheet('مطار الانطلاق الثابت',[para('يُستخدم كقيمة افتراضية.'),pk.el],[{label:'إلغاء'},{label:'حفظ',cls:'pri',keep:true,fn:()=>{base=pk.get();save();closeSheet();render();toast('تم التحديث')}}])};
$('bProfile').onclick=()=>{
  const nameI=document.createElement('input');nameI.value=profile.name||'';nameI.placeholder='الاسم';
  const surI=document.createElement('input');surI.value=profile.surname||'';surI.placeholder='اسم العائلة';surI.style.textTransform='uppercase';
  const emShow=document.createElement('input');emShow.value=auth.email;emShow.disabled=true;emShow.className='ltr';
  const phI=document.createElement('input');phI.value=(profile.phones||[]).join(' / ');phI.placeholder='أرقام الهاتف';
  const oI=document.createElement('input');oI.type='number';oI.value=profile.openH||12;
  const cI=document.createElement('input');cI.type='number';cI.value=profile.closeH||2;
  const g=h('div','g');
  [['الاسم',nameI],['اسم العائلة',surI],['📧 الإيميل (حسابك)',emShow,'full'],['الهاتف',phI,'full'],['يفتح قبل',oI],['يغلق قبل',cI]].forEach(([l,i,c])=>{const f=h('div','f'+(c==='full'?' full':''));f.append(h('label',null,l),i);g.appendChild(f)});

  const logoutBtn=h('button','auth-btn alt');logoutBtn.style.marginTop='16px';logoutBtn.textContent='🚪 تسجيل الخروج';
  logoutBtn.onclick=()=>{closeSheet();doLogout()};
  g.appendChild(logoutBtn);

  sheet('بياناتي',[para('بياناتك تُستخدم لتعبئة الرحلات تلقائيًا.'),g],[
    {label:'إلغاء'},
    {label:'حفظ',cls:'pri',keep:true,fn:()=>{
      profile.name=nameI.value.trim();profile.surname=surI.value.trim().toUpperCase();
      profile.phones=phI.value.split(/[\/,\s]+/).filter(x=>x.replace(/\D/g,'').length>=7);
      profile.openH=+oI.value||12;profile.closeH=+cI.value||2;
      save();closeSheet();toast('تم الحفظ');
    }}
  ]);
};
$('bExp').onclick=()=>copySheet('نسخة احتياطية',JSON.stringify({trips,base,profile}),()=>LS.set('lastBackup',Date.now()));
$('bImp').onclick=()=>{
  const ta=document.createElement('textarea');ta.placeholder='ألصق النسخة الاحتياطية';ta.style.minHeight='140px';
  sheet('استعادة نسخة احتياطية',[ta],[{label:'إلغاء'},{label:'فحص النسخة',cls:'pri',keep:true,fn:()=>{
    let d;try{d=JSON.parse(ta.value)}catch(e){return toast('النسخة غير صالحة — تأكد أنك نسخت النص كاملًا')}
    if(!d||!Array.isArray(d.trips))return toast('النسخة غير صالحة — لا توجد قائمة رحلات');
    const ok=d.trips.filter(n=>n&&n.id&&n.date&&n.time&&n.flight&&n.booking&&!isNaN(+new Date(n.date+'T'+n.time+':00')));
    const bad=d.trips.length-ok.length;
    if(!ok.length)return toast('لا توجد رحلات صالحة في هذه النسخة');
    const upd=ok.filter(n=>trips.some(x=>x.id===n.id)).length;
    const lines=[para('رحلات جديدة: '+(ok.length-upd)+' — رحلات موجودة سيتم تحديثها: '+upd+'.')];
    if(bad)lines.push(para('تم تجاهل '+bad+' رحلة غير مكتملة البيانات.'));
    if(d.profile||d.base)lines.push(para('سيتم أيضًا تحديث بياناتك الشخصية والمطار الافتراضي من النسخة.'));
    closeSheet();
    sheet('تأكيد الاستعادة',lines,[{label:'إلغاء'},{label:'استعادة الآن',cls:'pri',fn:()=>{
      ok.forEach(n=>{n.upd=n.upd||Date.now();trips=trips.filter(x=>x.id!==n.id);trips.push(n)});
      if(/^[A-Z]{3}$/.test(d.base))base=d.base;
      if(d.profile)profile=Object.assign(profile,d.profile);
      save();render();toast('تمت الاستعادة ('+ok.length+' رحلة)');buzz([40,60,40]);
    }}]);
  }}]);
};

// ===== Init =====
(async()=>{
  // تسجيل SW
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  
  // التحقق من الجلسة
  if(auth.token&&auth.email){
    $('auth').classList.add('off');
    render();tick();
    setInterval(tick,30000);
    cloudPull();
    setInterval(()=>cloudPull(),5*60000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)cloudPull()});
    // تأكد أن push مسجّل
    autoResubscribePush();
  }else{
    renderAuth();
    $('auth').classList.remove('off');
  }
})();

// فحص دوري لـ push banner
setInterval(async()=>{if(auth.token)await renderBanner()},60000);
